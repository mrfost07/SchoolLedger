name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: backend (typecheck, contract drift, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - name: OpenAPI contract drift check
        run: |
          npm run openapi
          git diff --exit-code openapi.json
      - run: npm test
      - run: npm run build

  frontend:
    name: frontend (contract drift, typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API schema drift check
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - name: Generate Next.js route types (LayoutProps/PageProps globals)
        run: npm run typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
